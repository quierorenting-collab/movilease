<style>
  /* Mismos colores que movilease.es (src/app/globals.css): el cliente tiene
     que reconocer la marca en la tarjeta que le dan con el coche. */
  :root {
    --dark: #0B2A5E;
    --dark-2: #10306B;
    --blue: #0068FF;
    --blue-light: #5AA0FF; /* texto azul sobre oscuro: 5,6:1, pasa AA */
    --ink: #0A0A0A;
    --paper: #FFFFFF;
    --page: #EEF2F8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: Inter, system-ui, sans-serif;
    padding: 24px 16px 48px;
  }

  /* ---------- Panel de control (no se imprime) ---------- */
  .panel {
    max-width: 760px;
    margin: 0 auto 28px;
    background: var(--paper);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 1px 3px rgba(11, 42, 94, .12);
  }
  .panel h1 { font: 700 20px/1.2 "Space Grotesk", sans-serif; color: var(--dark); }
  .panel p { font-size: 14px; line-height: 1.55; color: #33415C; margin-top: 8px; }
  .fila { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .fila input {
    flex: 1 1 260px;
    min-width: 0;
    font: 15px Inter, sans-serif;
    padding: 11px 13px;
    border: 1px solid #C9D3E3;
    border-radius: 10px;
  }
  .fila input:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
  button {
    font: 600 14px Inter, sans-serif;
    padding: 11px 18px;
    border-radius: 10px;
    border: 0;
    cursor: pointer;
    background: var(--blue);
    color: #fff;
  }
  button.sec { background: var(--dark); }
  .aviso { font-size: 13px; margin-top: 10px; min-height: 1.2em; }
  .aviso.mal { color: #B42318; }
  .aviso.bien { color: #067647; }
  .opciones { display: flex; gap: 16px; margin-top: 12px; font-size: 14px; flex-wrap: wrap; }
  .opciones label { display: flex; gap: 6px; align-items: center; cursor: pointer; }

  /* ---------- Hoja A4 con 10 tarjetas de visita (85 × 55 mm) ---------- */
  .hoja {
    width: 210mm;
    max-width: 100%;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(2, 85mm);
    justify-content: center;
    gap: 0;
  }
  /* En pantalla la hoja entera no cabe en un móvil: se ve una tarjeta
     escalada y el resto al imprimir. */
  @media screen and (max-width: 720px) {
    .hoja { grid-template-columns: 85mm; transform-origin: top center; }
    .hoja .tarjeta:nth-child(n+2) { display: none; }
  }

  .tarjeta {
    width: 85mm;
    height: 55mm;
    background: linear-gradient(135deg, var(--dark) 0%, var(--dark-2) 100%);
    color: #fff;
    display: grid;
    grid-template-columns: 1fr 30mm;
    gap: 4mm;
    padding: 5mm;
    position: relative;
    overflow: hidden;
    /* Marcas de corte finas: al recortar a mano se ve dónde va la tijera */
    outline: .2mm dashed rgba(11, 42, 94, .35);
    outline-offset: 0;
  }
  .tarjeta::after {
    /* Mismo brillo azul de las secciones oscuras de la web */
    content: "";
    position: absolute;
    right: -20mm;
    top: -20mm;
    width: 50mm;
    height: 50mm;
    background: radial-gradient(circle, rgba(0, 104, 255, .35) 0%, transparent 70%);
    pointer-events: none;
  }
  .izq { display: flex; flex-direction: column; justify-content: space-between; position: relative; z-index: 1; min-width: 0; }
  .logo { height: 6.2mm; width: auto; filter: brightness(0) invert(1); align-self: flex-start; }
  .titulo {
    font: 700 13.5pt/1.1 "Space Grotesk", sans-serif;
    letter-spacing: -.01em;
  }
  .titulo span { color: var(--blue-light); }
  .sub { font-size: 7.4pt; line-height: 1.4; color: rgba(255, 255, 255, .82); margin-top: 1.6mm; }
  .estrellas { color: #FFC83D; font-size: 9pt; letter-spacing: .6mm; }
  .pie { font-size: 6.6pt; color: rgba(255, 255, 255, .75); letter-spacing: .02em; }
  .pie b { color: #fff; font-weight: 600; }

  .der { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5mm; position: relative; z-index: 1; }
  .qr {
    width: 30mm;
    height: 30mm;
    background: #fff;
    border-radius: 2.2mm;
    padding: 1.6mm;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qr svg { width: 100%; height: 100%; display: block; }
  .qr .vacio { color: #6B7280; font-size: 6.5pt; text-align: center; line-height: 1.3; }
  .escanea { font-size: 6.2pt; color: rgba(255, 255, 255, .8); text-align: center; line-height: 1.25; }

  /* Versión en blanco: gasta menos tinta en impresoras de oficina */
  body.claro .tarjeta { background: #fff; color: var(--ink); }
  body.claro .tarjeta::after { background: radial-gradient(circle, rgba(0, 104, 255, .10) 0%, transparent 70%); }
  body.claro .logo { filter: none; }
  body.claro .titulo span { color: var(--blue); }
  body.claro .sub, body.claro .pie, body.claro .escanea { color: #33415C; }
  body.claro .pie b { color: var(--dark); }
  body.claro .qr { border: .3mm solid #D5DCE8; }

  @page { size: A4; margin: 10mm; }
  @media print {
    body { background: #fff; padding: 0; }
    .panel { display: none; }
    .hoja { width: auto; grid-template-columns: repeat(2, 85mm); }
    .hoja .tarjeta { display: grid !important; }
    .tarjeta { -webkit-print-color-adjust: exact; print-color-adjust: exact; break-inside: avoid; }
  }
</style>
</head>
<body>

<section class="panel" aria-label="Configuración">
  <h1>Tarjeta QR para pedir reseñas</h1>
  <p>Pega el enlace de reseña de tu ficha de Google (Google Business Profile → «Pedir reseñas»). El QR se genera aquí mismo. Después pulsa <b>Imprimir</b>: sale una hoja A4 con 10 tarjetas de visita de 85 × 55 mm para recortar.</p>
  <div class="fila">
    <input id="url" type="url" inputmode="url" placeholder="https://g.page/r/XXXXXXXX/review" aria-label="Enlace de reseña de Google">
    <button id="generar" type="button">Generar QR</button>
    <button id="imprimir" type="button" class="sec">Imprimir</button>
  </div>
  <p id="aviso" class="aviso" role="status"></p>
  <div class="opciones">
    <label><input id="claro" type="checkbox"> Fondo blanco (menos tinta)</label>
  </div>
</section>

<main class="hoja" id="hoja"></main>

<template id="plantilla">

      <div>
        <p class="estrellas" aria-hidden="true">★★★★★</p>
        <p class="titulo">¿Qué tal con <span>tu coche nuevo?</span></p>
        <p class="sub">Cuéntalo en Google. Tu opinión ayuda a otras personas a elegir su renting.</p>
      </div>
      <p class="pie"><b>Movilease Renting</b><br>movilease.es</p>

    <div class="der">
      <div class="qr"></div>
      <p class="escanea">Escanea con<br>la cámara</p>
    </div>

<script>
  const TARJETAS = 10;
  const $ = (id) => document.getElementById(id);
  const hoja = $("hoja");
  const plantilla = $("plantilla");

  for (let i = 0; i < TARJETAS; i++) hoja.appendChild(plantilla.content.cloneNode(true));

  function avisar(texto, tipo) {
    $("aviso").textContent = texto;
    $("aviso").className = "aviso " + (tipo || "");
  }

  /** Devuelve true solo si ha pintado el QR, para no anunciar «QR listo» sin él. */
  function pintar(url) {
    const cajas = hoja.querySelectorAll(".qr");
    if (!url) {
      cajas.forEach((c) => (c.innerHTML = '<p class="vacio">Pega el enlace<br>de reseña<br>arriba</p>'));
      return false;
    }
    let svg;
    try {
      // Corrección de errores M: aguanta arañazos y una impresión regular
      // sin hacer el código tan denso que cueste leerlo a 30 mm.
      const qr = qrcode(0, "M");
      qr.addData(url);
      qr.make();
      svg = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    } catch (e) {
      avisar("No se ha podido generar el QR. ¿Está bien copiado el enlace?", "mal");
      return false;
    }
    cajas.forEach((c) => (c.innerHTML = svg));
    return true;
  }

  function generar() {
    const url = $("url").value.trim();
    if (!url) { pintar(""); avisar(""); return; }
    let u;
    try { u = new URL(url); } catch { avisar("Eso no parece un enlace. Debe empezar por https://", "mal"); pintar(""); return; }
    if (u.protocol !== "https:") { avisar("El enlace debe empezar por https://", "mal"); pintar(""); return; }
    // Solo un aviso: Google usa varios formatos y no conviene bloquear ninguno.
    const deGoogle = /(^|\.)g\.page$|(^|\.)google\.[a-z.]+$|(^|\.)goo\.gl$/.test(u.hostname);
    if (!pintar(url)) return;
    avisar(
      deGoogle
        ? "QR listo. Pruébalo con la cámara del móvil antes de imprimir."
        : "QR generado, pero el enlace no es de Google. Comprueba que es el de «Pedir reseñas».",
      deGoogle ? "bien" : "mal"
    );
    // El enlace va en la dirección de la página: guardándola en favoritos
    // la próxima vez se abre ya con el QR hecho.
    try { history.replaceState(null, "", "?url=" + encodeURIComponent(url)); } catch {}
  }

  $("generar").addEventListener("click", generar);
  $("url").addEventListener("keydown", (e) => { if (e.key === "Enter") generar(); });
  $("imprimir").addEventListener("click", () => window.print());
  $("claro").addEventListener("change", (e) => document.body.classList.toggle("claro", e.target.checked));

  const inicial = new URLSearchParams(location.search).get("url");
  if (inicial) { $("url").value = inicial; generar(); } else { pintar(""); }
</script>
